    priority: 3
    title: "デリバリー層をスコープ外として明記する"
    addresses: F-R7
    why: >
      「無い」ことが判断の結果であって欠落ではない、と読める状態にする。
      これを書かないと、比較レポートを読んだ人が CD の実装を提案し続けることになる。
    targets:
