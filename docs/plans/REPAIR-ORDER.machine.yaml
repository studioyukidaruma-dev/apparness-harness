# ---------------------------------------------------------------------------
# 5. 着手しないもの
# ---------------------------------------------------------------------------
deferred:
  - id: R-DEFER-1
    title: "Rule 12 の読み取り・外部送信に対する事後検知"
    finding: >
      静的検知は bash -c 等の包み方をすり抜ける（実測: `bash -c \"rm harness/CONVENTIONS.md\"` は
      PreToolUse を通過する）。ただし書き込みと削除については PostToolUse が検知して
      復元することを実測で確認済みであり、実害は残らない。
      残る穴は「作業ツリーを変えない操作」＝秘密ファイルの読み取り（D-2）と
      外部送信（D-5）のみである。
    resolution: >
      既存 docs/plans/IMPROVEMENT-PLAN.machine.yaml の T-040 と同一の穴であり、
      あちらが条件付きタスクとして「実地で 1 件でもすり抜けが観測されるまで着手しない」
      という trigger を定めている。予防的な着手は検知手段（プロセス／ネットワーク監視）が
      INV-5（標準ライブラリのみ）と衝突するため、その判断を維持する。
    action: "着手しない。すり抜けを観測したら docs/maintenance/DOGFOODING-LOG.md に記録し、T-040 を起動する。"

  - id: R-DEFER-2
    title: "既定ブランチでの harness 不変チェックの有効化"
    finding: >
      ci_check.py check_harness_immutability() は既定ブランチ（main 等）では判定しない。
      fast-forward マージ運用では「元々どのブランチで作られたコミットか」が git 上に
      残らないため、main 上の押し込みと正当な harness/<topic> の ff マージが diff 上
      区別できないことが理由で、コード内に明記されている。
    resolution: >
      判定を有効化すると正当な ff マージが必ず落ちる。回避には merge commit の強制など
      運用の変更が必要で、これは改修ではなく運用方針の決定である。
    action: "着手しない。運用を変える判断はユーザーの領域。提案のみ可。"

