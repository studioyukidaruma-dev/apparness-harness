# schema: harness/schemas/requirements.schema.json
# 人間向けの requirements.md と内容を一致させること
app_id: "equipment-lending"
app_name: "備品貸出管理"
version: 1
status: DRAFT
summary: "会社の備品の在庫の数を管理するアプリ。現在は貸出を紙で管理しているため、どこに何が何個あるかがすぐ分からない。現場の作業員がスマホのブラウザから、備品の保管場所と在庫数を確認でき、誰がいつ何を借りたか・返したかを登録できる状態にする。データは社内サーバに保存し、全員が同じ在庫状況を見られるようにする。"
goals:
  - "スマホから在庫がわかる"
non_goals:
  - "権限管理はしない。"
target_users:
  - "現場の作業員。スマホから入力する。"
functional_requirements:
  - id: FR-1
    title: "備品の場所確認、在庫数確認"
    description: "どこに何が何個あるかすぐ確認できる。保管場所は `A棚` `2階倉庫` などの区画をタイル状に並べて表す（地図画像や地図サービスは使わない）。企画ブリーフの受け入れ基準の原文は「地図上に、ものと、数が表示される」で、ヒアリングで「地図」が保管場所の区画表示を指すと確認できたため検証可能な文に書き換えている。"
    priority: MUST
    acceptance_criteria:
      - "保管場所の区画ごとに、その区画にある備品名と数量が表示される"
  - id: FR-2
    title: "備品の貸出登録"
    description: "誰がいつ何を借りたかを記録する"
    priority: MUST
    acceptance_criteria:
      - "貸出を登録すると、一覧に借用者名と日時が表示される"
      - "ある作業員が登録した貸出が、別の作業員の画面の一覧にも表示される"
  - id: FR-3
    title: "備品の返却登録"
    description: "借りた備品を返したことを記録し、在庫数を元に戻す"
    priority: MUST
    acceptance_criteria:
      - "返却を登録すると、その備品の在庫数が貸出登録前の数に戻る"
  - id: FR-4
    title: "備品の検索"
    description: "備品名で絞り込んで目的の備品を探せる"
    priority: SHOULD
    acceptance_criteria:
      - "備品名の一部を入力して検索すると、一致する備品だけが表示される"
  - id: FR-5
    title: "貸出中一覧"
    description: "いま貸し出されたままになっている備品をまとめて確認できる"
    priority: SHOULD
    acceptance_criteria:
      - "貸出中一覧に、まだ返却されていない貸出が借用者名と日時とともに表示され、返却済みの貸出は表示されない"
non_functional_requirements:
  - category: "セキュリティ"
    description: "借用者名（個人情報）を含む貸出履歴に、社外のネットワークから到達できないこと。社内ネットワークからのみアクセスできればよく、ログイン（認証）は設けない。"
  - category: "データ"
    description: "備品情報と貸出履歴はサーバに保存し、全利用者が同じデータを参照できること。"
  - category: "規模"
    description: "現場作業員 20 名程度・全体で数十名が利用し、同時アクセスは数名を想定する。"
  - category: "利用形態"
    description: "スマホのブラウザから操作することを前提とした画面とする。"
constraints:
  - "有償ライセンスのライブラリは使用しない。"
  - "フロントエンドの実装方針は frontend-design skill の方針に寄せる（必須依存としては登録しない）。"
  - "UI あり（ブラウザで動作する画面を持つ）。"
  - "実行環境はブラウザ。"
  - "オフラインで動作する必要はない。"
  - "外部サービスとの連携はない。"
  - "社内サーバに配置する。"
  - "アプリ全体の完成条件は「各機能要件の受け入れ基準がすべて満たされること」とする。"
open_questions:
  - "Q6-a: 画面や操作の要望（文字の大きさ、片手で操作したい、屋外で見やすい配色など）の有無。"
  - "Q6-b: 期限・予算・社内ルールなどの制約の有無。"
approved_by: null
approved_at: null
superseded_by: null
