# schema: harness/schemas/architecture.schema.json
# features[] は互いに depends_on を持たない。つながりは interfaces[] でのみ表現する。
app_id: "equipment-lending"
design_version: 1
based_on_requirements_version: 1
status: APPROVED
shared_kernel_ref: "../01-foundation/shared-kernel.yaml"
features:
  - id: "equipment-master"
    name: "備品マスタ管理"
    description: >-
      どの区画にどの備品が何個あるかという「元データ」を持つ機能。SQLite のスキーマ作成
      （このアプリで CREATE を実行してよい唯一の機能）と、シード JSON からの取り込み・更新、
      備品マスタの読み出しを担う。画面も HTTP も持たない CLI ＋ モジュール。
    covers_requirements: ["FR-1"]
    contract_ref: "features/equipment-master.contract.yaml"
    status_ref: "../03-features/equipment-master/status.yaml"
    tech_stack:
      language: "JavaScript (ESM, Node.js 24 LTS)"
      framework: "なし（node:sqlite / node:fs / node:test の標準ライブラリのみ）"
      libraries: []
  - id: "inventory-view"
    name: "区画別在庫照会"
    description: >-
      備品マスタと貸出中数量から「区画ごとの備品名・総数・貸出中数・残数」を組み立てて返す
      読み取り専用の HTTP API（GET /api/inventory）。備品名の部分一致による絞り込みも担う。
      データの書き換えは一切行わない。
    covers_requirements: ["FR-1", "FR-3", "FR-4"]
    contract_ref: "features/inventory-view.contract.yaml"
    status_ref: "../03-features/inventory-view/status.yaml"
    tech_stack:
      language: "JavaScript (ESM, Node.js 24 LTS)"
      framework: "なし（node:http / node:sqlite / node:test の標準ライブラリのみ）"
      libraries: []
  - id: "lending-registry"
    name: "貸出・返却登録"
    description: >-
      貸出登録（POST /api/lendings）・返却登録（POST /api/lendings/{id}/return）・貸出中一覧
      （GET /api/lendings?status=active）を担う書き込み側の HTTP API。在庫を超える貸出・
      二重返却を拒否し、貸出中数量の集計を提供する。
    covers_requirements: ["FR-2", "FR-3", "FR-5"]
    contract_ref: "features/lending-registry.contract.yaml"
    status_ref: "../03-features/lending-registry/status.yaml"
    tech_stack:
      language: "JavaScript (ESM, Node.js 24 LTS)"
      framework: "なし（node:http / node:sqlite / node:crypto / node:test の標準ライブラリのみ）"
      libraries: []
  - id: "web-ui"
    name: "スマホ向け画面"
    description: >-
      現場作業員がスマホのブラウザで使う画面。区画をタイル状に並べて備品名と数量を表示し、
      検索・貸出登録・返却登録・貸出中一覧を操作できる。表示内容はサーバの応答だけから組み立て、
      画面側に独自の在庫状態を持たない。ビルド工程を持たない素の ES Modules + CSS。
    covers_requirements: ["FR-1", "FR-2", "FR-3", "FR-4", "FR-5"]
    contract_ref: "features/web-ui.contract.yaml"
    status_ref: "../03-features/web-ui/status.yaml"
    tech_stack:
      language: "JavaScript (ブラウザ ES Modules) / HTML5 / CSS3"
      framework: "なし（フレームワーク・バンドラを使わない。テストは node:test）"
      libraries: []
interfaces:
  - producer_feature: "equipment-master"
    producer_output: "equipment_master_records"
    consumer_feature: "inventory-view"
    consumer_input: "equipment_master_records"
  - producer_feature: "equipment-master"
    producer_output: "equipment_master_records"
    consumer_feature: "lending-registry"
    consumer_input: "equipment_master_records"
  - producer_feature: "lending-registry"
    producer_output: "active_lending_counts"
    consumer_feature: "inventory-view"
    consumer_input: "active_lending_counts"
  - producer_feature: "inventory-view"
    producer_output: "location_inventory_view"
    consumer_feature: "web-ui"
    consumer_input: "location_inventory_view"
  - producer_feature: "lending-registry"
    producer_output: "active_lending_list"
    consumer_feature: "web-ui"
    consumer_input: "active_lending_list"
  - producer_feature: "web-ui"
    producer_output: "inventory_query"
    consumer_feature: "inventory-view"
    consumer_input: "inventory_query"
  - producer_feature: "web-ui"
    producer_output: "lending_registration_request"
    consumer_feature: "lending-registry"
    consumer_input: "lending_registration_request"
  - producer_feature: "web-ui"
    producer_output: "return_registration_request"
    consumer_feature: "lending-registry"
    consumer_input: "return_registration_request"
superseded_by: null
