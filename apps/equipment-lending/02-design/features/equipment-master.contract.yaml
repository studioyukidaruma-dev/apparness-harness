# schema: harness/schemas/feature-contract.schema.json
# この機能の入出力の唯一の情報源。担当者はこのファイルと SPEC.md だけを見れば実装できる。
feature_id: "equipment-master"
feature_name: "備品マスタ管理"
version: 1
description: >-
  備品マスタ（どの区画にどの備品が何個あるか）の唯一の持ち主。SQLite のスキーマ作成と、
  シード JSON からの取り込み・更新、備品マスタの読み出しを担う。HTTP も画面も持たず、
  CLI（`node src/import-master.js <seed.json>`）と、他機能が同じ DB を読むためのテーブルを
  用意することが役目。在庫の残数計算や貸出の記録には一切関与しない。
inputs:
  - name: "equipment_seed_file"
    json_schema:
      type: "object"
      required: ["equipment"]
      properties:
        equipment:
          type: "array"
          items:
            type: "object"
            required: ["equipment_id", "name", "location_code", "location_name", "total_quantity"]
            properties:
              equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
              name: { "type": "string", "minLength": 1, "maxLength": 60 }
              location_code: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
              location_name: { "type": "string", "minLength": 1, "maxLength": 40 }
              total_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
    required: true
    description: "備品マスタの取り込み元となる JSON ファイルの中身。管理者がサーバ上で編集し、CLI で取り込む。1 件でも検証に通らない項目があれば全件取り込まない（部分適用しない）。"
    example: { "equipment": [ { "equipment_id": "DRILL-01", "name": "インパクトドライバ", "location_code": "A-SHELF", "location_name": "A棚", "total_quantity": 5 } ] }
outputs:
  - name: "equipment_master_records"
    json_schema:
      type: "array"
      items:
        type: "object"
        required: ["equipment_id", "name", "location_code", "location_name", "total_quantity", "updated_at"]
        properties:
          equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          name: { "type": "string", "minLength": 1, "maxLength": 60 }
          location_code: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          location_name: { "type": "string", "minLength": 1, "maxLength": 40 }
          total_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
          updated_at: { "type": "string", "format": "date-time" }
    description: "備品マスタの全件。location_code の昇順、同一区画内は name の昇順で返す。他機能はこの形の行を equipment テーブルから直接読む（コードの共有はしない）。"
    example: [ { "equipment_id": "DRILL-01", "name": "インパクトドライバ", "location_code": "A-SHELF", "location_name": "A棚", "total_quantity": 5, "updated_at": "2026-08-24T05:00:00.000Z" } ]
  - name: "master_import_result"
    json_schema:
      type: "object"
      required: ["inserted", "updated", "total"]
      properties:
        inserted: { "type": "integer", "minimum": 0 }
        updated: { "type": "integer", "minimum": 0 }
        total: { "type": "integer", "minimum": 0 }
    description: "取り込み結果の件数。CLI の標準出力に出す（借用者名などの個人情報は一切含まない）。"
    example: { "inserted": 12, "updated": 3, "total": 15 }
side_effects:
  - "SQLite ファイル（環境変数 EQUIPMENT_LENDING_DB）に shared-kernel.yaml の schema_ddl を適用する。このアプリで CREATE TABLE / CREATE INDEX を実行してよい唯一の機能。"
  - "equipment テーブルへの UPSERT（equipment_id をキーに挿入または更新）。取り込みは 1 トランザクションで行い、途中で失敗したら全件ロールバックする。"
  - "schema_version テーブルに適用済みバージョンを記録する。"
error_cases:
  - code: "E_SEED_INVALID"
    condition: "シード JSON が JSON として壊れている、equipment 配列が無い、または 1 件でも必須項目の欠落・型不一致・total_quantity が負の行がある"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_SEED_DUPLICATE_ID"
    condition: "シード JSON の中に同じ equipment_id が 2 件以上ある"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_QUANTITY_BELOW_ACTIVE_LENDING"
    condition: "total_quantity を、その備品の貸出中数量より小さい値に更新しようとした（在庫が負になるため拒否する）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_STORE_UNAVAILABLE"
    condition: "DB ファイルを開けない、書き込み権限がない"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
tech_stack:
  language: "JavaScript (ESM, Node.js 24 LTS)"
  framework: "なし（node:sqlite / node:fs / node:test の標準ライブラリのみ）"
  libraries: []
non_functional:
  security:
    - "SQL はすべてプリペアドステートメントで組み立てる（文字列連結禁止）。シード JSON の値は入口で json_schema 相当の検証を行ってから DB に渡す。"
    - "CLI の出力・例外メッセージにファイルの絶対パスやスタックトレースを出さない。"
  data:
    - "取り込みは全件成功か全件失敗のいずれか（トランザクション）。"
test_strategy:
  approach: >-
    node:test で、(1) シード JSON の検証、(2) :memory: の SQLite に対するスキーマ作成と UPSERT、
    (3) 区画・備品名・数量の読み出し順序、(4) error_cases の各コードを検証する。DB は
    node:sqlite の :memory: を使い、外部プロセス・ファイルに依存しない。
  coverage:
    - requirement: "FR-1"
      acceptance_criterion: "保管場所の区画ごとに、その区画にある備品名と数量が表示される"
      test_ids:
        - "tests/master-import.test.js::imports_seed_and_returns_records_grouped_by_location"
        - "tests/master-import.test.js::rejects_seed_with_missing_or_invalid_fields"
created_at: "2026-08-24T14:40:00Z"
approved_at: null
approved_by: null
