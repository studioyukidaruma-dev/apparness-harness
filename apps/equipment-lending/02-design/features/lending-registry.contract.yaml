# schema: harness/schemas/feature-contract.schema.json
# この機能の入出力の唯一の情報源。担当者はこのファイルと SPEC.md だけを見れば実装できる。
feature_id: "lending-registry"
feature_name: "貸出・返却登録"
version: 1
description: >-
  貸出台帳の持ち主。貸出登録（POST /api/lendings）、返却登録
  （POST /api/lendings/{lending_id}/return）、貸出中一覧（GET /api/lendings?status=active）を
  提供する。在庫を超える貸出と二重返却を拒否し、他機能が残数を計算するための
  「備品ごとの貸出中数量」も出力する。備品マスタは読むだけで書き換えない。
inputs:
  - name: "lending_registration_request"
    json_schema:
      type: "object"
      required: ["equipment_id", "borrower_name"]
      properties:
        equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
        borrower_name: { "type": "string", "minLength": 1, "maxLength": 40 }
        quantity: { "type": "integer", "minimum": 1, "maximum": 9999 }
    required: true
    description: "貸出登録の要求（JSON ボディ）。quantity を省略したときは 1 とみなす。borrower_name は前後の空白を落としたうえで空文字なら拒否する。"
    example: { "equipment_id": "DRILL-01", "borrower_name": "山田太郎", "quantity": 1 }
  - name: "return_registration_request"
    json_schema:
      type: "object"
      required: ["lending_id"]
      properties:
        lending_id: { "type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
    required: true
    description: "返却登録の要求。対象の貸出 1 件を lending_id で指定する（部分返却はしない。貸出した数量をまとめて返す）。"
    example: { "lending_id": "6f1c2a34-5b6d-4e7f-8a9b-0c1d2e3f4a5b" }
  - name: "equipment_master_records"
    json_schema:
      type: "array"
      items:
        type: "object"
        required: ["equipment_id", "name", "total_quantity"]
        properties:
          equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          name: { "type": "string", "minLength": 1, "maxLength": 60 }
          total_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
    required: true
    description: "equipment-master が用意した備品マスタの行（equipment テーブルから読む）。存在しない備品への貸出を拒否し、在庫超過を判定し、貸出中一覧に備品名を添えるために使う。"
    example: [ { "equipment_id": "DRILL-01", "name": "インパクトドライバ", "total_quantity": 5 } ]
outputs:
  - name: "active_lending_counts"
    json_schema:
      type: "array"
      items:
        type: "object"
        required: ["equipment_id", "active_quantity"]
        properties:
          equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          active_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
    description: "備品ごとの貸出中数量（returned_at IS NULL の quantity 合計）。貸出中が 0 件の備品は含めない。equipment_id の昇順。"
    example: [ { "equipment_id": "DRILL-01", "active_quantity": 2 } ]
  - name: "active_lending_list"
    json_schema:
      type: "object"
      required: ["generated_at", "lendings"]
      properties:
        generated_at: { "type": "string", "format": "date-time" }
        lendings:
          type: "array"
          items:
            type: "object"
            required: ["lending_id", "equipment_id", "equipment_name", "borrower_name", "quantity", "lent_at"]
            properties:
              lending_id: { "type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
              equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
              equipment_name: { "type": "string", "minLength": 1, "maxLength": 60 }
              borrower_name: { "type": "string", "minLength": 1, "maxLength": 40 }
              quantity: { "type": "integer", "minimum": 1, "maximum": 9999 }
              lent_at: { "type": "string", "format": "date-time" }
    description: "まだ返却されていない貸出の一覧（returned_at IS NULL）。lent_at の降順（新しい順）。返却済みの貸出は含めない。"
    example:
      generated_at: "2026-08-24T05:00:00.000Z"
      lendings:
        - lending_id: "6f1c2a34-5b6d-4e7f-8a9b-0c1d2e3f4a5b"
          equipment_id: "DRILL-01"
          equipment_name: "インパクトドライバ"
          borrower_name: "山田太郎"
          quantity: 1
          lent_at: "2026-08-24T04:30:00.000Z"
  - name: "lending_registration_result"
    json_schema:
      type: "object"
      required: ["lending_id", "equipment_id", "borrower_name", "quantity", "lent_at"]
      properties:
        lending_id: { "type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
        borrower_name: { "type": "string", "minLength": 1, "maxLength": 40 }
        quantity: { "type": "integer", "minimum": 1, "maximum": 9999 }
        lent_at: { "type": "string", "format": "date-time" }
    description: "貸出登録が成功したときの応答（HTTP 201）。lending_id は node:crypto の randomUUID() で採番する。"
    example: { "lending_id": "6f1c2a34-5b6d-4e7f-8a9b-0c1d2e3f4a5b", "equipment_id": "DRILL-01", "borrower_name": "山田太郎", "quantity": 1, "lent_at": "2026-08-24T04:30:00.000Z" }
  - name: "return_registration_result"
    json_schema:
      type: "object"
      required: ["lending_id", "equipment_id", "quantity", "returned_at"]
      properties:
        lending_id: { "type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
        equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
        quantity: { "type": "integer", "minimum": 1, "maximum": 9999 }
        returned_at: { "type": "string", "format": "date-time" }
    description: "返却登録が成功したときの応答（HTTP 200）。この時点で貸出中数量から quantity が外れる。"
    example: { "lending_id": "6f1c2a34-5b6d-4e7f-8a9b-0c1d2e3f4a5b", "equipment_id": "DRILL-01", "quantity": 1, "returned_at": "2026-08-24T07:10:00.000Z" }
side_effects:
  - "lending テーブルへの INSERT（貸出登録）と、returned_at の UPDATE（返却登録）。行は削除しない（履歴を残す）。"
  - "貸出登録は『貸出中数量の再集計 → 在庫超過の判定 → INSERT』を 1 つのトランザクション（BEGIN IMMEDIATE）で行い、同時登録による在庫割れを防ぐ。"
error_cases:
  - code: "E_INVALID_REQUEST"
    condition: "JSON として壊れている、必須項目が無い、型・長さ・数値範囲が inputs の json_schema に合わない（HTTP 400）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_EQUIPMENT_NOT_FOUND"
    condition: "指定された equipment_id が備品マスタに存在しない（HTTP 404）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_INSUFFICIENT_STOCK"
    condition: "要求数量が残数（total_quantity - 貸出中数量）を超える（HTTP 409）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_LENDING_NOT_FOUND"
    condition: "返却対象の lending_id が存在しない（HTTP 404）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_ALREADY_RETURNED"
    condition: "返却対象の貸出が既に返却済み（returned_at が入っている）（HTTP 409）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_STORE_UNAVAILABLE"
    condition: "DB ファイルを開けない、または equipment / lending テーブルが存在しない（HTTP 500）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
tech_stack:
  language: "JavaScript (ESM, Node.js 24 LTS)"
  framework: "なし（node:http / node:sqlite / node:crypto / node:test の標準ライブラリのみ）"
  libraries: []
non_functional:
  security:
    - "在庫超過・二重返却の判定は必ずサーバ側（登録処理の入口）で行う。画面のボタンの活性/非活性だけに頼らない。"
    - "borrower_name をログ・エラーメッセージ・例外メッセージに出力しない（個人情報）。"
    - "SQL はすべてプリペアドステートメント。リクエストボディは 64KB を超えたら読み捨てて E_INVALID_REQUEST を返す。"
  data:
    - "返却は行の削除ではなく returned_at の更新で表す（誰がいつ借りたかの履歴を残すため）。"
test_strategy:
  approach: >-
    node:sqlite の :memory: DB に shared-kernel の schema_ddl を適用し、node:test から
    登録 → 一覧 → 返却 → 一覧の順で検証する。「別の作業員の画面にも見える」ことは、
    登録に使ったのとは別の DB 接続・別のハンドラ実体から一覧を読み、同じ貸出が見えることで検証する
    （プロセス内の変数に状態を持たないことの検証）。エラー系は error_cases の code ごとに 1 件ずつ。
  coverage:
    - requirement: "FR-2"
      acceptance_criterion: "貸出を登録すると、一覧に借用者名と日時が表示される"
      test_ids:
        - "tests/lending-registry.test.js::registers_lending_and_lists_borrower_name_and_lent_at"
    - requirement: "FR-2"
      acceptance_criterion: "ある作業員が登録した貸出が、別の作業員の画面の一覧にも表示される"
      test_ids:
        - "tests/lending-registry.test.js::lending_registered_by_one_connection_is_visible_from_another"
    - requirement: "FR-3"
      acceptance_criterion: "返却を登録すると、その備品の在庫数が貸出登録前の数に戻る"
      test_ids:
        - "tests/lending-registry.test.js::return_removes_quantity_from_active_lending_counts"
        - "tests/lending-registry.test.js::rejects_second_return_of_same_lending"
    - requirement: "FR-5"
      acceptance_criterion: "貸出中一覧に、まだ返却されていない貸出が借用者名と日時とともに表示され、返却済みの貸出は表示されない"
      test_ids:
        - "tests/lending-registry.test.js::active_list_contains_open_lendings_with_borrower_and_datetime"
        - "tests/lending-registry.test.js::active_list_excludes_returned_lendings"
created_at: "2026-08-24T14:40:00Z"
approved_at: null
approved_by: null
