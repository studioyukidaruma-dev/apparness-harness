# schema: harness/schemas/feature-contract.schema.json
# この機能の入出力の唯一の情報源。担当者はこのファイルと SPEC.md だけを見れば実装できる。
feature_id: "inventory-view"
feature_name: "区画別在庫照会"
version: 1
description: >-
  備品マスタの行と貸出中数量から「区画ごとの備品名・総数・貸出中数・残数」を組み立てて返す
  読み取り専用の HTTP API（GET /api/inventory[?keyword=...]）。組み立ての中心は
  `buildLocationInventoryView(masterRecords, activeLendingCounts, query)` という純関数で、
  DB アクセスはその外側の薄いアダプタに閉じる。データの書き換えは一切行わない。
inputs:
  - name: "equipment_master_records"
    json_schema:
      type: "array"
      items:
        type: "object"
        required: ["equipment_id", "name", "location_code", "location_name", "total_quantity"]
        properties:
          equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          name: { "type": "string", "minLength": 1, "maxLength": 60 }
          location_code: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          location_name: { "type": "string", "minLength": 1, "maxLength": 40 }
          total_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
    required: true
    description: "equipment-master が用意した備品マスタの行（equipment テーブルから読む）。updated_at は使わない。"
    example: [ { "equipment_id": "DRILL-01", "name": "インパクトドライバ", "location_code": "A-SHELF", "location_name": "A棚", "total_quantity": 5 } ]
  - name: "active_lending_counts"
    json_schema:
      type: "array"
      items:
        type: "object"
        required: ["equipment_id", "active_quantity"]
        properties:
          equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
          active_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
    required: true
    description: "lending-registry が定める『返却されていない貸出の数量合計』を備品ごとに集計したもの（lending テーブルの returned_at IS NULL を集計して得る）。この配列に現れない備品は貸出中 0 とみなす。"
    example: [ { "equipment_id": "DRILL-01", "active_quantity": 2 } ]
  - name: "inventory_query"
    json_schema:
      type: "object"
      properties:
        keyword: { "type": "string", "maxLength": 60 }
    required: false
    description: "備品名の部分一致による絞り込み条件（FR-4）。keyword が無い・空文字なら絞り込みをしない。前後の空白を落とし、大文字小文字を区別せずに部分一致させる。"
    example: { "keyword": "ドライバ" }
outputs:
  - name: "location_inventory_view"
    json_schema:
      type: "object"
      required: ["generated_at", "keyword", "locations"]
      properties:
        generated_at: { "type": "string", "format": "date-time" }
        keyword: { "type": "string" }
        locations:
          type: "array"
          items:
            type: "object"
            required: ["location_code", "location_name", "items"]
            properties:
              location_code: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
              location_name: { "type": "string", "minLength": 1, "maxLength": 40 }
              items:
                type: "array"
                items:
                  type: "object"
                  required: ["equipment_id", "name", "total_quantity", "lent_quantity", "available_quantity"]
                  properties:
                    equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
                    name: { "type": "string", "minLength": 1, "maxLength": 60 }
                    total_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
                    lent_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
                    available_quantity: { "type": "integer", "minimum": 0, "maximum": 9999 }
    description: >-
      区画タイル 1 枚 = locations[] の 1 要素。keyword には実際に適用した絞り込み語（無指定なら
      空文字）を入れて返す。available_quantity = total_quantity - lent_quantity。
      絞り込みの結果 items が空になった区画は locations[] に含めない。区画は location_code 昇順、
      items は name 昇順。
    example:
      generated_at: "2026-08-24T05:00:00.000Z"
      keyword: ""
      locations:
        - location_code: "A-SHELF"
          location_name: "A棚"
          items:
            - equipment_id: "DRILL-01"
              name: "インパクトドライバ"
              total_quantity: 5
              lent_quantity: 2
              available_quantity: 3
side_effects:
  - "なし（読み取り専用。SELECT 以外の SQL を実行しない）。"
error_cases:
  - code: "E_INVALID_QUERY"
    condition: "keyword が 60 文字を超える、または文字列以外が渡された（HTTP 400）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_STORE_UNAVAILABLE"
    condition: "DB ファイルを開けない、または equipment / lending テーブルが存在しない（HTTP 500。equipment-master の取り込みが未実施の場合を含む）"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
tech_stack:
  language: "JavaScript (ESM, Node.js 24 LTS)"
  framework: "なし（node:http / node:sqlite / node:test の標準ライブラリのみ）"
  libraries: []
non_functional:
  security:
    - "keyword は SQL に文字列連結で埋め込まない。絞り込みは純関数側（JavaScript）で行うか、プリペアドステートメントの LIKE パラメータとして渡す。"
    - "エラー応答は error_cases の code と短い日本語 message だけにし、SQL・パス・スタックトレースを含めない。"
  performance:
    - "備品数は数百件規模を想定。1 リクエストにつき SELECT は 2 本まで（マスタ・貸出中集計）とする。"
test_strategy:
  approach: >-
    組み立ての中心が純関数なので、node:test で入力配列を直接与えて出力 JSON を検証する。
    DB アダプタは node:sqlite の :memory: に shared-kernel の schema_ddl を適用して検証する。
    HTTP ハンドラはリクエスト/レスポンスのダブルを渡して status と body を検証する。
  coverage:
    - requirement: "FR-1"
      acceptance_criterion: "保管場所の区画ごとに、その区画にある備品名と数量が表示される"
      test_ids:
        - "tests/inventory-view.test.js::groups_items_by_location_with_name_and_quantities"
    - requirement: "FR-3"
      acceptance_criterion: "返却を登録すると、その備品の在庫数が貸出登録前の数に戻る"
      test_ids:
        - "tests/inventory-view.test.js::available_quantity_returns_to_total_when_active_lending_becomes_zero"
    - requirement: "FR-4"
      acceptance_criterion: "備品名の一部を入力して検索すると、一致する備品だけが表示される"
      test_ids:
        - "tests/inventory-view.test.js::filters_items_by_partial_name_keyword"
        - "tests/inventory-view.test.js::omits_locations_that_have_no_matching_items"
created_at: "2026-08-24T14:40:00Z"
approved_at: null
approved_by: null
