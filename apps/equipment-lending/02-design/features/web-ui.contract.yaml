# schema: harness/schemas/feature-contract.schema.json
# この機能の入出力の唯一の情報源。担当者はこのファイルと SPEC.md だけを見れば実装できる。
feature_id: "web-ui"
feature_name: "スマホ向け画面"
version: 1
description: >-
  現場作業員がスマホのブラウザで使う画面。区画をタイル状に並べて備品名・残数を表示し、
  検索・貸出登録・返却登録・貸出中一覧を行う。ビルド工程を持たない素の HTML/CSS/ES Modules で作り、
  描画は「サーバの応答（JSON）を受け取って HTML 文字列を返す純関数」に閉じる
  （renderInventory / renderActiveLendings など）。画面側に在庫の状態を持たず、
  登録操作のあとは必ずサーバから読み直す。
inputs:
  - name: "location_inventory_view"
    json_schema:
      type: "object"
      required: ["locations"]
      properties:
        generated_at: { "type": "string", "format": "date-time" }
        keyword: { "type": "string" }
        locations:
          type: "array"
          items:
            type: "object"
            required: ["location_code", "location_name", "items"]
            properties:
              location_code: { "type": "string" }
              location_name: { "type": "string" }
              items:
                type: "array"
                items:
                  type: "object"
                  required: ["equipment_id", "name", "total_quantity", "lent_quantity", "available_quantity"]
                  properties:
                    equipment_id: { "type": "string" }
                    name: { "type": "string" }
                    total_quantity: { "type": "integer" }
                    lent_quantity: { "type": "integer" }
                    available_quantity: { "type": "integer" }
    required: true
    description: "GET /api/inventory の応答。これを区画タイルとして描画する。locations が空配列のときは空状態（empty state）の文言を出す。"
    example:
      generated_at: "2026-08-24T05:00:00.000Z"
      keyword: ""
      locations:
        - location_code: "A-SHELF"
          location_name: "A棚"
          items:
            - equipment_id: "DRILL-01"
              name: "インパクトドライバ"
              total_quantity: 5
              lent_quantity: 2
              available_quantity: 3
  - name: "active_lending_list"
    json_schema:
      type: "object"
      required: ["lendings"]
      properties:
        generated_at: { "type": "string", "format": "date-time" }
        lendings:
          type: "array"
          items:
            type: "object"
            required: ["lending_id", "equipment_name", "borrower_name", "quantity", "lent_at"]
            properties:
              lending_id: { "type": "string" }
              equipment_id: { "type": "string" }
              equipment_name: { "type": "string" }
              borrower_name: { "type": "string" }
              quantity: { "type": "integer" }
              lent_at: { "type": "string", "format": "date-time" }
    required: true
    description: "GET /api/lendings?status=active の応答。貸出中一覧として描画し、各行に返却ボタンを置く。lendings が空のときは空状態の文言を出す。"
    example:
      generated_at: "2026-08-24T05:00:00.000Z"
      lendings:
        - lending_id: "6f1c2a34-5b6d-4e7f-8a9b-0c1d2e3f4a5b"
          equipment_id: "DRILL-01"
          equipment_name: "インパクトドライバ"
          borrower_name: "山田太郎"
          quantity: 1
          lent_at: "2026-08-24T04:30:00.000Z"
  - name: "api_error_response"
    json_schema:
      type: "object"
      required: ["error"]
      properties:
        error:
          type: "object"
          required: ["code", "message"]
          properties:
            code: { "type": "string" }
            message: { "type": "string" }
    required: false
    description: "API が返すエラー本体。code に応じた日本語の案内文を画面に出す（未知の code は message をそのまま出す）。色だけでなくアイコンと文言でエラーだと分かるようにする。"
    example: { "error": { "code": "E_INSUFFICIENT_STOCK", "message": "在庫が足りません" } }
outputs:
  - name: "inventory_query"
    json_schema:
      type: "object"
      properties:
        keyword: { "type": "string", "maxLength": 60 }
    description: "検索ボックスの入力から組み立てる GET /api/inventory のクエリ。空欄なら keyword を送らない。入力のたびに送らず、300ms のデバウンスをかける。"
    example: { "keyword": "ドライバ" }
  - name: "lending_registration_request"
    json_schema:
      type: "object"
      required: ["equipment_id", "borrower_name"]
      properties:
        equipment_id: { "type": "string", "pattern": "^[A-Za-z0-9_-]{1,32}$" }
        borrower_name: { "type": "string", "minLength": 1, "maxLength": 40 }
        quantity: { "type": "integer", "minimum": 1, "maximum": 9999 }
    description: "貸出フォームの送信内容（POST /api/lendings のボディ）。borrower_name は前後の空白を落として送る。残数 0 の備品では貸出ボタンを disabled にするが、判定の正はサーバ側にある。"
    example: { "equipment_id": "DRILL-01", "borrower_name": "山田太郎", "quantity": 1 }
  - name: "return_registration_request"
    json_schema:
      type: "object"
      required: ["lending_id"]
      properties:
        lending_id: { "type": "string", "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" }
    description: "貸出中一覧の返却ボタンから送る内容（POST /api/lendings/{lending_id}/return のボディ）。二重送信を防ぐため送信中はボタンを disabled にする。"
    example: { "lending_id": "6f1c2a34-5b6d-4e7f-8a9b-0c1d2e3f4a5b" }
side_effects:
  - "ブラウザから API を呼び出す（fetch）。ローカルストレージ・クッキーに在庫や貸出の状態を保存しない。"
  - "静的ファイル（index.html / app.css / *.js）として配信する。ビルド・トランスパイルを行わない。"
error_cases:
  - code: "E_NETWORK_UNAVAILABLE"
    condition: "API 呼び出しが失敗した（通信断・タイムアウト）。画面に再試行ボタン付きの案内を出し、直前の表示を勝手に書き換えない。"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
  - code: "E_FORM_INVALID"
    condition: "借用者名が未入力、または数量が 1 未満。送信前に画面側で止め、どの項目が問題かをテキストで示す。"
    response_shape: { "type": "object", "required": ["error"], "properties": { "error": { "type": "object", "required": ["code", "message"], "properties": { "code": { "type": "string" }, "message": { "type": "string" } } } } }
tech_stack:
  language: "JavaScript (ブラウザ ES Modules) / HTML5 / CSS3"
  framework: "なし（フレームワーク・バンドラを使わない。テストのみ node:test を使う）"
  libraries: []
non_functional:
  security:
    - "備品名・借用者名などサーバ由来の文字列を innerHTML に直接入れない。textContent か、契約で定めたエスケープ関数を通す（借用者名は利用者が自由に入力するため XSS の入口になる）。"
    - "画面に表示する以外の目的で借用者名を保存・送信しない。"
  usability:
    - "本文 16px 以上・ボタンのラベル 18px 以上、タップ対象 44x44px 以上・間隔 8px 以上（要件の非機能要件）。"
    - "文字と背景のコントラスト比 4.5:1 以上（大きい文字は 3:1 以上）。屋外の明るい場所での判読を優先する。"
    - "loading / empty / error の 3 状態を必ず持つ（何も起きていないように見える状態を作らない）。"
    - "幅 375px と 1280px の双方で横スクロールが発生しないこと。"
test_strategy:
  approach: >-
    描画を「JSON → HTML 文字列」の純関数に切り出し、node:test から直接呼んで出力文字列を検証する
    （ブラウザや DOM ライブラリを追加せずに受入基準を検証できる形にするための設計）。
    フォームの組み立ても「入力値 → リクエストボディ」の純関数として検証する。
    実ブラウザでの見た目・タップ領域の確認は統合フェーズのチェックリストで行う。
  coverage:
    - requirement: "FR-1"
      acceptance_criterion: "保管場所の区画ごとに、その区画にある備品名と数量が表示される"
      test_ids:
        - "tests/render-inventory.test.js::renders_one_tile_per_location_with_item_name_and_quantity"
    - requirement: "FR-2"
      acceptance_criterion: "貸出を登録すると、一覧に借用者名と日時が表示される"
      test_ids:
        - "tests/render-lendings.test.js::renders_borrower_name_and_formatted_lent_at"
        - "tests/lending-form.test.js::builds_lending_request_from_form_values"
    - requirement: "FR-2"
      acceptance_criterion: "ある作業員が登録した貸出が、別の作業員の画面の一覧にも表示される"
      test_ids:
        - "tests/render-lendings.test.js::renders_only_from_server_response_without_local_state"
    - requirement: "FR-3"
      acceptance_criterion: "返却を登録すると、その備品の在庫数が貸出登録前の数に戻る"
      test_ids:
        - "tests/render-inventory.test.js::renders_restored_available_quantity_after_reload"
        - "tests/lending-form.test.js::builds_return_request_from_lending_row"
    - requirement: "FR-4"
      acceptance_criterion: "備品名の一部を入力して検索すると、一致する備品だけが表示される"
      test_ids:
        - "tests/lending-form.test.js::builds_inventory_query_from_search_box"
        - "tests/render-inventory.test.js::renders_empty_state_when_no_item_matches"
    - requirement: "FR-5"
      acceptance_criterion: "貸出中一覧に、まだ返却されていない貸出が借用者名と日時とともに表示され、返却済みの貸出は表示されない"
      test_ids:
        - "tests/render-lendings.test.js::renders_every_lending_returned_by_active_list_endpoint"
        - "tests/render-lendings.test.js::escapes_borrower_name_in_markup"
created_at: "2026-08-24T14:40:00Z"
approved_at: null
approved_by: null
