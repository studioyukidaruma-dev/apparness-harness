      と衝突し、監査可能性という優位を失う可能性が高い。
    targets:
      - harness/hooks/post_tool_use_guard.py
      - harness/CLAIMS.md
    acceptance:
      - "すり抜けた実例が DOGFOODING-LOG.md に摩擦点として記録されている（着手の前提）。"
      - "追加した検知が INV-5（Python 標準ライブラリのみ）を満たしている。"
      - "CLAIMS.md の Rule 12 の行から『未実証の残余』が減っている。"
    verification:
      - "python3 -m pytest harness/tests -q"
    blocked_by: [T-010]

# ---------------------------------------------------------------------------
# 5. やらないこと
# ---------------------------------------------------------------------------
non_goals:
  - id: NG-1
    statement: "マルチホスト対応（Codex CLI / Cursor / Grok）をしない。"
    reason: >
      apparness の Rule 3・7・9・10・11 は『書き込み前後の内容比較』に依存する。
      Bash-only の PreToolUse しか持たないホストでは原理的に成立しない。
      比較対象自身が docs/hardening-parity.md で false parity を禁じ、
      ホストごとに強制の強さが違うことを明記している。同じ罠に入らない。

  - id: NG-2
    statement: "強制エンジンを Go 等でバイナリ化しない。"
    reason: >
      INV-5。比較対象は 13MB の Go バイナリのみを配布し、ソースが配布物に含まれていなかった（実測 0 エントリ）。
      『AI を縛る側のコードが読める』ことは apparness の明確な優位であり、性能のために手放す価値はない。
      性能が問題になったら、まず Hook の起動回数と matcher の絞り込みで対処する。

  - id: NG-3
    statement: "skill / subagent / ドキュメントの数を増やさない。"
    reason: >
      比較対象は skill 23・スクリプト 155・docs 143 に達し、認知負荷そのものを扱う文書を持つに至っている。
      apparness の CI 項目 L / M / O はまさにこれを防ぐ装置であり、緩めてはならない。
      新機能は既存の skill / script のオプションとして実装することを第一候補にする。

  - id: NG-4
    statement: "既存リポジトリでの日常開発（brownfield）に対応しない。"
    reason: >
      apps/<app-id> のディレクトリ構造と状態機械が前提になっており、対応は事実上の作り直しになる。
      その用途には claude-code-harness を併用するほうが合理的。
      この判断は HARNESS_GUIDE.md にスコープとして明記すること。

  - id: NG-5
    statement: "TDD 強制や検証ゲートを『既定オフ』にする設定を導入しない。"
    reason: >
      比較対象は [tdd.enforce] enabled = false を配布既定にしており、
      強制機構が存在しても効いていない状態が既定になっている。
      apparness の Rule 10 / 11 は既定で常に効く。この性質を設定可能にしてはならない。

  - id: NG-6
    statement: "AI に危険操作の可否を確認させる（ask）方式を、拒否（deny）の代わりに採用しない。"
    reason: >
      AUTONOMOUS モードでは AI 自身が確認に答えてしまう。
      人間の判断を挟みたい操作は、ask ではなく deny にしたうえで
      『人間が別途手で実行する』という運用に倒す。

# ---------------------------------------------------------------------------
# 6. 完了判定
# ---------------------------------------------------------------------------
done_criteria:
  phase_0:
    tasks: [T-000, T-001, T-002]
    statement: "改修の土台。予算に余裕が戻り、Rule と実証テストの対応が取れている。"
  phase_1:
    tasks: [T-010, T-011]
    statement: "安全性の穴が塞がっている。危険操作が拒否され、強制レイヤの不全が可視化される。"
  phase_2:
    tasks: [T-020, T-021, T-022]
    statement: "既知の不具合が直り、版と実績が追跡可能になっている。"
  phase_3:
    tasks: [T-030, T-031, T-032]
    statement: "運用面の底上げ。非エンジニアが判断でき、制約と失敗が資産化されている。"
  conditional:
    tasks: [T-040]
    statement: >
      条件付きタスク。trigger に書かれた事象が観測されるまで着手しない。
      done_criteria には含めない（着手しないことが正しい状態）。

